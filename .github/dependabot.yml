version: 2
updates:
  # No "pip" ecosystem entry on purpose. This project has ZERO pip
  # dependencies by design (stdlib only - see CLAUDE.md "Scripts use stdlib
  # only") and ships no requirements.txt, pyproject.toml or setup.py, so a pip
  # entry has no manifest to track and can never produce an update.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
